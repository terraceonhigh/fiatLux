name: Check repository

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - run: make check
      - run: make
      - run: make ledger
      - run: git diff --exit-code -- planning/manuscript-ledger.md
