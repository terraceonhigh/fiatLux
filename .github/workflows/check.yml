name: Check repository

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - run: make check
      - run: make
      - run: make ledger
      # The ledger is derived from the manuscript. A stale copy is a nudge to run
      # `make ledger`, not a build failure: manuscript edits made on the web or
      # another device cannot regenerate it.
      - run: |
          git diff --quiet -- planning/manuscript-ledger.md ||
            echo "::warning file=planning/manuscript-ledger.md::Ledger is stale; run make ledger"
